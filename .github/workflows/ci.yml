name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLUMB_LLM_DISABLED: "1"
      HF_HOME: ~/.cache/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/cache@v4
        with: { path: ~/.cache/hf, key: hf-models-v1 }
      - name: Install backend
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Unit + API tests
        working-directory: backend
        run: python -m pytest -q
      - name: Golden-set evaluation (precision / recall per check)
        working-directory: backend
        run: python -m eval.run_eval | tee eval-summary.txt
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Browser end-to-end journey
        run: |
          python backend/scripts/make_demo_files.py
          (cd backend && PLUMB_DATA_DIR=/tmp/plumb-e2e uvicorn app.main:app --port 8000 &) 
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 2; done
          sleep 5
          PLUMB_URL=http://localhost:8000 python -m pytest e2e -q
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: backend/eval/results.json }
